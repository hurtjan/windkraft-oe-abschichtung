[project]
name = "calc"
version = "2.0.0"
description = "Windkraft-Potentialberechnung Oesterreich (Energiewerkstatt/IG Windkraft 2023)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "rasterio",
    "geopandas",
    "pandas",
    "pyarrow",
    "pyogrio",
    "pyproj",
    "Pillow",
    "matplotlib",
    "PyMuPDF",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["calc", "pipeline"]
